services:
  postgresDb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motionqa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-motionqa_logs}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motionqa_admin} -d ${POSTGRES_DB:-motionqa_logs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisCache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backendApi:
    # Explicit lowercase image names: compose would otherwise derive invalid names from the camelCase service names.
    image: motionqa-backend:local
    build:
      context: ./backend
      dockerfile: backendDockerfile
    environment:
      MOTIONQA_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-motionqa_admin}:${POSTGRES_PASSWORD}@postgresDb:5432/${POSTGRES_DB:-motionqa_logs}
      MOTIONQA_REDIS_URL: redis://redisCache:6379/0
      MOTIONQA_ALLOWED_ORIGINS: ${MOTIONQA_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MOTIONQA_AUTO_CREATE_TABLES: "true"
      MOTIONQA_REQUIRE_AUTH: ${MOTIONQA_REQUIRE_AUTH:-true}
      MOTIONQA_API_TOKENS: ${MOTIONQA_API_TOKENS:-}
      MOTIONQA_LINE_ID: ${MOTIONQA_LINE_ID:-LINE_01}
      MOTIONQA_EVIDENCE_BACKEND: ${MOTIONQA_EVIDENCE_BACKEND:-local}
      MOTIONQA_EVIDENCE_BUCKET: ${MOTIONQA_EVIDENCE_BUCKET:-}
      MOTIONQA_EVIDENCE_RETENTION_DAYS: ${MOTIONQA_EVIDENCE_RETENTION_DAYS:-30}
      AWS_REGION: ${AWS_REGION:-}
      # Only the nginx container reaches the API, so forwarded client addresses can be trusted for rate limiting.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/models:/srv/motionQa/models:ro
      - evidence:/srv/motionQa/evidence
    depends_on:
      postgresDb:
        condition: service_healthy
      redisCache:
        condition: service_healthy

  frontendUi:
    image: motionqa-frontend:local
    build:
      context: ./frontend
      dockerfile: frontendDockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_BASE_URL: ""
        VITE_LINE_ID: ${MOTIONQA_LINE_ID:-LINE_01}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backendApi

  edgeProcessor:
    image: motionqa-backend:local
    build:
      context: ./backend
      dockerfile: backendDockerfile
    command: ["python", "-m", "motionQa.edge.edgeProcessor"]
    environment:
      MOTIONQA_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-motionqa_admin}:${POSTGRES_PASSWORD}@postgresDb:5432/${POSTGRES_DB:-motionqa_logs}
      MOTIONQA_REDIS_URL: redis://redisCache:6379/0
      MOTIONQA_RTSP_URL: ${MOTIONQA_RTSP_URL:?Set the RTSP URL of the stationary inspection camera}
      MOTIONQA_LINE_ID: ${MOTIONQA_LINE_ID:-LINE_01}
      MOTIONQA_STATION_ID: ${MOTIONQA_STATION_ID:-STATION_01}
    volumes:
      - ./backend/models:/srv/motionQa/models:ro
      - evidence:/srv/motionQa/evidence
    profiles:
      - edge
    depends_on:
      redisCache:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  evidence:
